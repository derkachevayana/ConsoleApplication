spring:
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false
    discovery:
      enabled: false
  config:
    import: "optional:file:./nonexistent.yml"
    use-legacy-processing: false

eureka:
  client:
    enabled: false
    fetch-registry: false
    register-with-eureka: false

resilience4j:
  circuitbreaker:
    enabled: false
  retry:
    enabled: false

management:
  endpoints:
    enabled-by-default: false